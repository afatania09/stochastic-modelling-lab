[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-modelling-lab"
version = "0.1.0"
description = "Computational laboratory for stochastic processes, SDE simulation, Monte Carlo methods and quantitative finance."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ashutosh Fatania"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=stochastic_lab --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
